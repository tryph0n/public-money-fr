services:
  - type: web
    name: public-money-fr
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --no-sync streamlit run app/Home.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
