name: Hugging Face publish check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m core.publish.hf_check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
