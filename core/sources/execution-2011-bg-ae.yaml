traps:
- 'The records hold no year field: the year 2011 is read in the dataset title (field metas.default.title: ''(PLR 2011)''). The id gives the same year.'
- On 26 November 2026, 254 of the 637 datasets of data.economie.gouv.fr have metas.default.modified on 13 December 2018, between 20:21 and 22:10 UTC, which looks like a date of the portal (a move), not a date that the producer states. It is used here because this dataset has no other date (no attachment, and metas.default.data_processed is the day the portal last processed the records); it is later than the end of the executed year.
- The portal has no execution dataset of the annex budgets for 2010 to 2012 (no id or title of these years names them), so the annex budgets of these years are missing from the sources.
- 'Long shape, not wide: one record per programme, action and title, with the columns t_categorie (T1 to T7) and valeur. The payment credit dataset of the same year is wide by title, so a parser must not assume one shape per year.'
- The dataset holds the budget general only.
