traps:
  - The attachments are plain CSV. When the request asks for gzip (Accept-Encoding), the server answers with Content-Encoding gzip; a client that does not decode it reads bytes that start with 1f 8b. Check the response header, not the file name.
  - The record of the dataset is not the data; the data is in the attachments.
  - The revenue file is named Annexe1-Etat_Recettes.csv, without the year; the 2023 and 2025 datasets name it differently.
  - The producer states no usable date of last update, so last_update is empty and a dataset card refuses this input until the owner decides. On the data.economie.gouv.fr API (read on 26 November 2026), metas.default.modified and dcat.created are 2024-04-17, which is before the end of the year 2024 that the data covers and is also the value of the PLRG 2025 dataset; metas.default.data_processed (2025-05-05) is the day the portal last processed the dataset, not a date that the producer states.
