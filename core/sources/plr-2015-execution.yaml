  basis: >-
    Articles L321-1 and L322-1 of the code des relations entre le public et l'administration.
    Article L321-1 lets any person reuse public information for other purposes than the
    public service mission. Article L322-1 sets the condition that the information is not
    altered, that its meaning is not distorted, and that its source and the date of its last
    update are named. So the source and the date of the last update are named, and the
    meaning is not distorted.
