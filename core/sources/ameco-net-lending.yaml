traps:
  - Years after the last closed year are forecasts and must be flagged.
  - Each code has several series, one per unit; select the series code explicitly.
  - 'The AMECO page says "The main data source is Eurostat (the Statistical Office of the European Commission), complemented, where necessary, by other appropriate national and international sources". The legal notice says "content owned by the EU on this website is licensed under the Creative Commons Attribution 4.0 International (CC BY 4.0) licence" and, for content not owned by the EU, "you may need to seek permission directly from the rightholders". The notice names no AMECO file, so CC BY 4.0 is the licence the Commission states for its own content; whether it reaches data that comes from Eurostat or other sources is not settled by the notice.'
  - AMECO is read from the Commission, not through DBnomics, because DBnomics distributes its aggregated datasets under the ODbL (share-alike) and the project publishes under Licence Ouverte 2.0 (decision of the owner, 26 November 2026).
  - In the Redisstat SDMX API (agency ECFIN) the AMECO series are in the dataflows AMECO_CHAPTERxx-yy; this one is in AMECO_CHAPTER16-04 (columns REF_AREA, ITEM, UNIT), which serves France UBLGE in the three units 0, 99 and 319, from 1960 to 2028. The dataflows FDMS_* (for example FDMS_UBLGE, columns INDICATOR, GEO, UNIT, unit 319 only) are a different dataset, not AMECO.
  - The chapter zip is replaced at each AMECO update (the file on 26 November 2026 was last modified on 24 November 2026); store the retrieval date with the data.
  - At each AMECO update the chapter zip changes, so its pin changes; read last_update again on the download page then.
