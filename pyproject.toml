[project]
name = "public-money-fr"
version = "0.1.0"
description = "Open data projects on French public money, built on a shared core package."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx2>=2.16.2",
    "huggingface-hub>=2.4.0",
    "pandas>=3.1.1",
    "pandera>=0.36.0",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.4",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "mypy",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit",
    "pytest",
    "ruff",
    "types-pyyaml>=6.0.12.20261122",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.2.0",
    "sphinx>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "projects"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".doc", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
# D1xx rules demand a docstring on every public object; this project checks the style of the
# docstrings that exist, not their presence.
ignore = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"app/**" = ["D"]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
